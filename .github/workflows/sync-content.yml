name: Sync content from Sanity

# Fired by a webhook from Sanity whenever the doctor presses Publish, and
# available as a manual button in the Actions tab.
#
# Deliberately NOT triggered by `push` — this workflow pushes a commit itself,
# and a push trigger would make it retrigger forever.
on:
  repository_dispatch:
    types: [sanity-update]
  workflow_dispatch:

# Only ever one sync in flight; a rapid series of edits collapses into the
# latest state rather than racing to commit.
# Every run regenerates all content from scratch, so a newer run always
# supersedes an older one. Cancelling in progress means a burst of publishes
# (editing several sections in one sitting) collapses into a single deploy
# instead of one per publish. Cancelling is safe: a run that doesn't reach its
# push simply changes nothing.
concurrency:
  group: sync-content
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Each attempt starts by resetting to the current tip of main, then
      # regenerates content from Sanity on top of it. That makes the job immune
      # to a stale base — whether from re-running an older run, or from a commit
      # landing while this one sat in the queue. Sanity is the source of truth
      # for content.json, so regenerating is always the correct resolution and
      # no merge conflict is possible.
      #
      # sync-content.mjs exits non-zero if Sanity returns incomplete content,
      # which aborts the step and leaves the site untouched.
      - name: Sync content and push
        run: |
          git config user.name "sanity-content-sync"
          git config user.email "actions@github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/sync-content.mjs

            if git diff --quiet; then
              echo "No content changes — nothing to deploy."
              exit 0
            fi

            git add frontend/src/data/content.json frontend/public/images
            git commit -m "Update site content from Sanity"

            if git push origin HEAD:main; then
              echo "Pushed updated content — Vercel will deploy it."
              exit 0
            fi

            echo "main moved while this job ran — retrying (attempt $attempt of 3)…"
          done

          echo "::error::Could not push after 3 attempts."
          exit 1
